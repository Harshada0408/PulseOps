services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: api_monitor
      POSTGRES_PASSWORD: dev_password
      POSTGRES_DB: api_monitor
    volumes:
      - postgres_data:/var/lib/postgresql/data
    ports:
      - "5434:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U api_monitor"]
      interval: 5s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 5

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
      target: development
    ports:
      - "3001:3001"
    environment:
      - NODE_ENV=development
      - PORT=3001
      # Container-internal database address. DATABASE_URL in .env points at
      # localhost:5434 for tooling run directly on the host, which is unreachable
      # from inside the compose network, so the two are configured separately.
      # Override DATABASE_URL_DOCKER to target an external database instead.
      - DATABASE_URL=${DATABASE_URL_DOCKER:-postgresql://api_monitor:dev_password@postgres:5432/api_monitor}
      - REDIS_URL=redis://redis:6379
      # Defaults to the bundled Supabase provider when empty. Set
      # AUTH_PROVIDER_MODULE in .env to authenticate against a different identity
      # system; the three SUPABASE_* values are then ignored and not required.
      - AUTH_PROVIDER_MODULE=${AUTH_PROVIDER_MODULE:-}
      - SUPABASE_URL=${SUPABASE_URL}
      - SUPABASE_SERVICE_ROLE_KEY=${SUPABASE_SERVICE_ROLE_KEY}
      - SUPABASE_ANON_KEY=${SUPABASE_ANON_KEY}
      - JWT_SECRET=${JWT_SECRET}
      - FRONTEND_URL=http://localhost:3000
      - STRIPE_SECRET_KEY=${STRIPE_SECRET_KEY}
      - STRIPE_WEBHOOK_SECRET=${STRIPE_WEBHOOK_SECRET}
      - RESEND_API_KEY=${RESEND_API_KEY}
      - FROM_EMAIL=${FROM_EMAIL}
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully
    volumes:
      - ./backend:/app
      - /app/node_modules
    command: npx ts-node-dev --respawn --transpile-only src/server.ts

  worker:
    build:
      context: .
      dockerfile: worker/Dockerfile
      target: development
    environment:
      - NODE_ENV=development
      - DATABASE_URL=${DATABASE_URL_DOCKER:-postgresql://api_monitor:dev_password@postgres:5432/api_monitor}
      - REDIS_URL=redis://redis:6379
      - CHECK_INTERVAL_SECONDS=30
      # Hard ceiling on the response body a check will read. Clamped to 64 MiB.
      - MAX_RESPONSE_BYTES=${MAX_RESPONSE_BYTES:-1048576}
      - RESEND_API_KEY=${RESEND_API_KEY}
      - FROM_EMAIL=${FROM_EMAIL}
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully
    volumes:
      - ./worker:/app
      - /app/node_modules
    command: npx ts-node-dev --respawn --transpile-only src/index.ts
    # The worker exits non-zero when the database schema is missing, which is the
    # normal state on a first `docker compose up` before migrations run. Restarting
    # lets it recover on its own once `npm run db:migrate` completes.
    restart: unless-stopped

  migrate:
    build:
      context: ./backend
      dockerfile: Dockerfile
      target: development
    environment:
      - NODE_ENV=development
      - DATABASE_URL=${DATABASE_URL_DOCKER:-postgresql://api_monitor:dev_password@postgres:5432/api_monitor}
    depends_on:
      postgres:
        condition: service_healthy
    # Applies the Prisma migrations, then exits. Backend and worker wait for this to
    # complete successfully, so a fresh clone comes up with a usable schema without a
    # manual migration step.
    command: npx prisma migrate deploy --schema prisma/schema.prisma
    restart: "no"

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
      target: development
    ports:
      - "3000:3000"
    environment:
      - NEXT_PUBLIC_API_URL=http://localhost:3001
      - NEXT_PUBLIC_SUPABASE_URL=${NEXT_PUBLIC_SUPABASE_URL}
      - NEXT_PUBLIC_SUPABASE_ANON_KEY=${NEXT_PUBLIC_SUPABASE_ANON_KEY}
    depends_on:
      - backend
    volumes:
      - ./frontend:/app
      # Anonymous volume keeps the image's node_modules visible. Without it the bind
      # mount above shadows them and `next dev` fails with "next: not found".
      - /app/node_modules
    command: npm run dev

volumes:
  postgres_data:
