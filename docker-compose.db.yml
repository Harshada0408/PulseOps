# Optional: PostgreSQL only, for people who prefer Docker Desktop over a native install.
#   docker compose -f docker-compose.db.yml up -d
# Then set in .env:  DATABASE_URL="postgresql://pulseops:pulseops_dev@localhost:5432/pulseops"
# (Throwaway local development credentials; use your own for anything else.)
services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: pulseops
      POSTGRES_PASSWORD: pulseops_dev
      POSTGRES_DB: pulseops
    ports:
      - "5432:5432"
    volumes:
      - pulseops_pg:/var/lib/postgresql/data
volumes:
  pulseops_pg:
