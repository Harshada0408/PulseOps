name: CI

on:
  push:
    branches:
      - main
      - develop
      - release/**
      - feature/**
      - hotfix/**
  pull_request:
    branches:
      - main
      - develop
      - release/**

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend:
    name: Backend Build, Lint & Tests
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: test
          POSTGRES_PASSWORD: test
          POSTGRES_DB: test
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    env:
      DATABASE_URL: postgresql://test:test@localhost:5432/test
      JWT_SECRET: test-secret-key-for-ci-only-32chars
      NODE_ENV: test
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install Dependencies
        run: npm ci

      - name: Generate Prisma Client
        run: npm run db:generate -w backend

      - name: Run Prisma Migrations
        working-directory: backend
        run: |
          if [ -d prisma/migrations ]; then
            npx prisma migrate deploy
          else
            echo "No migrations found. Skipping."
          fi

      - name: TypeScript Build
        run: npm run build -w backend

      - name: Lint
        run: npm run lint -w backend

      - name: Typecheck
        run: npm run typecheck -w backend

      - name: Run Tests
        run: npm test -w backend -- --passWithNoTests

  licenses:
    name: Dependency License Audit
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22

      # Fails the build if docs/THIRD_PARTY_LICENSES.md is stale, or if any
      # dependency introduces a copyleft or unrecognized license. The project is
      # MIT and depends on staying commercially redistributable, so this is
      # enforced mechanically rather than by review.
      - name: Verify license inventory is current
        run: npm run licenses:check --silent

  frontend:
    name: Frontend Build, Lint & Typecheck
    runs-on: ubuntu-latest
    env:
      NEXT_PUBLIC_API_URL: http://localhost:3001
      NEXT_PUBLIC_SUPABASE_URL: https://test.supabase.co
      NEXT_PUBLIC_SUPABASE_ANON_KEY: test-key
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install Dependencies
        run: npm ci

      - name: Build Frontend
        run: npm run build -w frontend

      - name: Lint
        run: npm run lint -w frontend

      - name: Typecheck
        run: npm run typecheck -w frontend

  worker:
    name: Worker Build, Test, Lint & Typecheck
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install Dependencies
        run: npm ci

      - name: Build Worker
        run: npm run build -w worker

      - name: Test
        run: npm test -w worker

      - name: Lint
        run: npm run lint -w worker

      - name: Typecheck
        run: npm run typecheck -w worker

  docker:
    name: Docker Validation
    runs-on: ubuntu-latest
    needs:
      - backend
      - frontend
      - worker
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build Backend Image
        uses: docker/build-push-action@v6
        with:
          context: ./backend
          push: false
          tags: api-monitor-backend:test

      - name: Build Frontend Image
        uses: docker/build-push-action@v6
        with:
          context: ./frontend
          push: false
          tags: api-monitor-frontend:test

      - name: Build Worker Image
        uses: docker/build-push-action@v6
        with:
          context: .
          dockerfile: worker/Dockerfile
          push: false
          tags: api-monitor-worker:test

  summary:
    name: CI Summary
    runs-on: ubuntu-latest
    needs:
      - backend
      - frontend
      - worker
      - docker
      - licenses
    steps:
      - name: Success
        run: echo "All CI checks passed successfully."