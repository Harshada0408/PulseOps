<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="640" viewBox="0 0 1280 640">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0f172a"/>
      <stop offset="1" stop-color="#1e3a8a"/>
    </linearGradient>
    <linearGradient id="accent" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#3b82f6"/>
      <stop offset="1" stop-color="#8b5cf6"/>
    </linearGradient>
  </defs>
  <rect width="1280" height="640" fill="url(#bg)"/>
  <circle cx="1130" cy="110" r="180" fill="#3b82f6" opacity="0.15"/>
  <circle cx="150" cy="520" r="220" fill="#8b5cf6" opacity="0.12"/>
  <text x="80" y="120" font-family="Arial, Helvetica, sans-serif" font-size="30" font-weight="bold" fill="#94a3b8" letter-spacing="3">API MONITOR SaaS</text>
  <rect x="80" y="240" width="72" height="10" rx="5" fill="url(#accent)"/>
  <text x="80" y="320" font-family="Arial, Helvetica, sans-serif" font-size="56" font-weight="bold" fill="#f8fafc">Keep your APIs &amp; sites</text>
  <text x="80" y="392" font-family="Arial, Helvetica, sans-serif" font-size="56" font-weight="bold" fill="#f8fafc">up. Know the moment they drop.</text>
  <text x="80" y="452" font-family="Arial, Helvetica, sans-serif" font-size="26" fill="#cbd5e1">Periodic HTTP health checks · uptime &amp; response-time analytics · email alerts</text>
  <text x="80" y="500" font-family="Arial, Helvetica, sans-serif" font-size="22" fill="#94a3b8">Free &amp; open source · Next.js + Express + Prisma + monitoring worker · MIT</text>
  <g transform="translate(80,560)">
    <rect x="0" y="0" width="260" height="52" rx="26" fill="url(#accent)"/>
    <text x="130" y="33" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="20" font-weight="bold" fill="#ffffff">Self-host with Docker</text>
  </g>
</svg>
